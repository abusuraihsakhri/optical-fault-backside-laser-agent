name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Test Python
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q agents optical_fault_agent cli.py simulator.py enrichment.py
      - name: Test browser JavaScript
        run: |
          node --check web/app.js
          node --test web/test_app.cjs
