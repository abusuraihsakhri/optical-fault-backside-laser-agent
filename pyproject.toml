[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optical-fault-backside-laser-engine"
version = "2.0.0"
description = "Backside Silicon Laser Fault Injection Optical Emission Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
optical-fault-backside-laser-engine = "optical_fault_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/optical-fault-backside-laser-engine"
Repository = "https://github.com/abusuraihsakhri/optical-fault-backside-laser-engine.git"
